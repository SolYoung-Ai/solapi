<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SolAPI</title>
  <desc id="desc">统一 AI 模型接入网关标识：多个模型汇聚为一个 API。</desc>
  <defs>
    <linearGradient id="solapi-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D96A36"/>
      <stop offset="1" stop-color="#A94725"/>
    </linearGradient>
    <radialGradient id="solapi-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 92) rotate(51) scale(342 382)">
      <stop stop-color="#F6A15F" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F6A15F" stop-opacity="0"/>
    </radialGradient>
    <filter id="solapi-shadow" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".55" stdDeviation=".65" flood-color="#3E1A0D" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#solapi-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#solapi-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.25" fill="none" stroke="#FFD9BF" stroke-opacity=".22" stroke-width="1.5"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" filter="url(#solapi-shadow)">
    <path d="M160 150 L240 258"/>
    <path d="M352 150 L272 258"/>
    <path d="M256 408 L256 306"/>
  </g>
  <g fill="#FFFFFF" filter="url(#solapi-shadow)">
    <circle cx="160" cy="150" r="26"/>
    <circle cx="352" cy="150" r="26"/>
    <circle cx="256" cy="408" r="26"/>
  </g>
  <circle cx="256" cy="272" r="46" fill="#FFFFFF"/>
  <circle cx="256" cy="272" r="22" fill="#A94725"/>
</svg>
